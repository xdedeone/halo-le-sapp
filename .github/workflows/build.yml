name: Build SAPP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build SAPP (Release Win32)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure LuaJIT sources exist
        shell: pwsh
        run: |
          if (-not (Test-Path "3pp/LuaJIT-2.1.0-beta3/src/msvcbuild.bat")) {
            Write-Host "LuaJIT not found in repository, cloning branch v2.1..."
            New-Item -ItemType Directory -Force -Path "3pp"
            git clone --depth 1 --branch v2.1 https://github.com/LuaJIT/LuaJIT.git 3pp/LuaJIT-2.1.0-beta3
          }

      - name: Setup MSVC developer environment (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build LuaJIT dependency
        shell: cmd
        run: |
          cd 3pp\LuaJIT-2.1.0-beta3\src
          call msvcbuild.bat static

      - name: Build 7z
        run: |
          msbuild 3pp\7z\C\7z.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m

      - name: Build SappPacker
        run: |
          msbuild SappPacker\SappPacker.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m

      - name: Build SAPP
        run: |
          msbuild Sapp\Sapp.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m

      - name: Upload SAPP DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sapp-release
          path: Release/sapp.dll
          if-no-files-found: error
